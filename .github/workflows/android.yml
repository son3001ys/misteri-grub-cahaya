name: Build Misteri Grub Cahaya APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Check project ZIP
    run: |
      ls -la
      test -f MisteriGrubCahaya.zip

  - name: Extract project ZIP
    run: |
      mkdir -p project
      unzip -o MisteriGrubCahaya.zip -d project
      find project -type f | head -100

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Locate Android project
    run: |
      find project -name settings.gradle -o -name settings.gradle.kts
      find project -name gradlew

  - name: Build APK
    run: |
      GRADLEW=$(find project -name gradlew -type f | head -1)
      if [ -z "$GRADLEW" ]; then
        echo "Gradle Wrapper tidak ditemukan dalam ZIP."
        exit 1
      fi
      PROJECT_DIR=$(dirname "$GRADLEW")
      cd "$PROJECT_DIR"
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Misteri-Grub-Cahaya-APK
      path: project/**/build/outputs/apk/debug/*.apk
