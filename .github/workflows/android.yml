name: Build Misteri Grub Cahaya APK

"on":
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Check ZIP file
    run: |
      ls -la
      test -f MisteriGrubCahaya.zip

  - name: Extract project
    run: |
      mkdir -p project
      unzip -o MisteriGrubCahaya.zip -d project
      find project -type f | head -100

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Find Gradle Wrapper
    run: |
      find project -type f -name gradlew

  - name: Build APK
    run: |
      GRADLEW="$(find project -type f -name gradlew | head -1)"
      if [ -z "$GRADLEW" ]; then
        echo "ERROR: Gradle Wrapper tidak ditemukan."
        exit 1
      fi
      PROJECT_DIR="$(dirname "$GRADLEW")"
      cd "$PROJECT_DIR"
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Misteri-Grub-Cahaya-APK
      path: project/**/build/outputs/apk/debug/*.apk
